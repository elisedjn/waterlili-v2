title:
  en: 'Ginger cat'
  fr: 'Chat roux'
  pt: 'Gato ruivo'
alt:
  en: 'Seen from behind, a ginger cat sits quietly among the greenery and gazes at the blue sky. A summer watercolor full of light and freshness.'
  fr: 'Vu de dos, un chat roux est installé tranquillement parmi la verdure et contemple le ciel bleu. Une aquarelle d''été pleine de lumière et de fraîcheur.'
  pt: 'Visto de costas, um gato ruivo está sossegado no meio da vegetação e contempla o céu azul. Uma aguarela de verão cheia de luz e frescura.'
description:
  en: |-
    This cat is here to remind you that you are allowed to stop, look at the sky and do nothing else for a while.
  fr: |-
    Ce chat te rappelle qu'on a le droit de s'arrêter, de regarder le ciel et de ne rien faire d'autre pendant un moment.
  pt: |-
    Este gato lembra-te de que tens o direito de parar, olhar para o céu e não fazer mais nada durante um bocado.
formats: [a6, a5, a4]
tags: [animals]
