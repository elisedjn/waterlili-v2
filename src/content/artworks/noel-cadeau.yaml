title:
  en: 'Christmas - Present'
  fr: 'Nöel - Cadeau'
  pt: 'Natal - Presente'
alt:
  en: 'Two little gnomes with red hats exchange a gift under the falling snow. A Christmas card to say "joyeuse noël" with tenderness.'
  fr: "Deux petits gnomes aux bonnets rouges s'échangent un cadeau sous la neige qui tombe. Une carte de Noël pour dire « joyeuse noël » avec tendresse."
  pt: 'Dois gnomos de gorros vermelhos trocam um presente sob a neve que cai. Um cartão de Natal para dizer "joyeuse noël" com ternura.'
description:
  en: |-
    The best gift is the one given from the heart. Merry Christmas to the people who matter to you!
    The text written on the card can be customised.
  fr: |-
    Le plus beau des cadeaux, c'est celui qu'on offre avec le cœur. Joyeux Noël à ceux qui comptent pour toi !
    Le texte inscrit sur la carte peut être personnalisé.
  pt: |-
    O melhor presente é aquele que se oferece com o coração. Feliz Natal a quem conta para ti!
    O texto escrito na carta pode ser personalizado.
formats: [a5card]
tags: [christmas]
