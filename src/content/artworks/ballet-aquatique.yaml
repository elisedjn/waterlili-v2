title:
  en: 'Water ballet'
  fr: 'Ballet aquatique'
  pt: 'Ballet aquático'
alt:
  en: 'A little snorkeler with yellow fins floats on her back, surrounded by a slow ballet of pink jellyfish, in turquoise water lit by the sun.'
  fr: 'Une petite nageuse équipée de palmes jaunes flotte sur le dos, entourée d''un lent ballet de méduses roses, dans une eau turquoise éclairée par le soleil.'
  pt: 'Uma pequena mergulhadora com barbatanas amarelas flutua de costas, rodeada por um lento bailado de alforrecas cor-de-rosa, numa água turquesa iluminada pelo sol.'
description:
  en: |-
    When we let ourselves drift, the ocean sometimes puts on the most beautiful show. Close your eyes, breathe, and float.
  fr: |-
    Quand on se laisse porter, l'océan offre parfois le plus beau des spectacles. Ferme les yeux, respire, et laisse-toi flotter.
  pt: |-
    Quando nos deixamos levar, o oceano por vezes oferece o mais belo espetáculo. Fecha os olhos, respira e deixa-te flutuar.
formats: [a6, a5, a4]
tags: [sea]
