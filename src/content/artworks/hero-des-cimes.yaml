title:
  en: 'Heroes of the Peaks'
  fr: 'Héros des cimes'
  pt: 'Heróis das montanhas'
alt:
  en: 'A little hero with a red cape and his teddy bear stands in the grass, facing a huge snowy mountain, ready for the great adventure.'
  fr: 'Un petit héros à la cape rouge, son ours en peluche à la main, se tient dans l''herbe face à une immense montagne enneigée, prêt pour la grande aventure.'
  pt: 'Um pequeno herói de capa vermelha, com o seu urso de peluche na mão, está na relva diante de uma imensa montanha nevada, pronto para a grande aventura.'
description:
  en: |-
    The biggest mountains look smaller with a cape, a teddy bear and a heart full of courage.
  fr: |-
    Les plus grandes montagnes semblent plus petites quand on a une cape, un doudou et du courage plein le cœur.
  pt: |-
    As maiores montanhas parecem mais pequenas com uma capa, um peluche e o coração cheio de coragem.
formats: [a6, a5, a4]
