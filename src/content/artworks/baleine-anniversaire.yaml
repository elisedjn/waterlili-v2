title:
  en: 'Birthday whale'
  fr: "Baleine d'anniversaire"
  pt: 'Baleia de aniversário'
alt:
  en: 'A happy blue whale ties a bunch of colorful balloons around its belly to celebrate a birthday. A joyful, delicate watercolor to wish someone a happy birthday.'
  fr: 'Une baleine bleue toute joyeuse a noué autour du ventre un bouquet de ballons multicolores pour fêter un anniversaire. Une aquarelle pleine de légèreté pour souhaiter un joyeux anniversaire.'
  pt: 'Uma baleia azul muito feliz prendeu à barriga um ramo de balões coloridos para festejar um aniversário. Uma aguarela leve e alegre para desejar parabéns.'
description:
  en: |-
    This whale has decided that every passing year deserves a cloud of balloons. Shall we do the same, just for the joy of celebrating?
  fr: |-
    Cette baleine a décidé que chaque année qui passe méritait une pluie de ballons. Et si on faisait pareil, juste pour le plaisir de célébrer ?
  pt: |-
    Esta baleia decidiu que cada ano que passa merece uma nuvem de balões. E se fizéssemos o mesmo, só pelo prazer de celebrar?
formats: [a6]
tags: [birthday, sea, animals]
