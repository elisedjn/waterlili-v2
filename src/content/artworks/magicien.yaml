title:
  en: 'Starhunter'
  fr: "Chasseur d'étoiles"
  pt: 'Caçador de estrelas'
alt:
  en: 'A little wizard in a starry robe stretches his arm toward a golden star, floating among pink jellyfish in a sea turned into a night sky.'
  fr: 'Un petit magicien en robe étoilée tend le bras vers une étoile dorée, flottant parmi des méduses roses dans une mer devenue ciel de nuit.'
  pt: 'Um pequeno mágico de túnica estrelada estende o braço em direção a uma estrela dourada, a flutuar entre alforrecas cor-de-rosa num mar transformado em céu noturno.'
description:
  en: |-
    This little wizard reminds you that there is no harm in reaching for a star, even when it seems very far away.
  fr: |-
    Ce petit magicien te rappelle qu'il n'y a pas de mal à tendre la main vers une étoile, même si elle semble très loin.
  pt: |-
    Este pequeno mágico lembra-te de que não faz mal nenhum estender a mão para uma estrela, mesmo que pareça muito longe.
formats: [a6, a5]
tags: [sea, night]
