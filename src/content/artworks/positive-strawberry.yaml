title:
  en: 'Positive strawberry'
  fr: 'Positive strawberry'
  pt: 'Positive strawberry'
alt:
  en: 'A bright red strawberry holds a note: "I love you berry much!". A sweet pun to say I love you.'
  fr: 'Une fraise d''un rouge éclatant tient un mot : « I love you berry much! ». Un jeu de mots tout doux pour dire je t''aime.'
  pt: 'Um morango de um vermelho vivo segura um bilhete: "I love you berry much!". Um jogo de palavras doce para dizer eu amo-te.'
description:
  en: |-
    To say "I love you" with a little sweetness and a lot of humor. A declaration that melts in the mouth.
  fr: |-
    Pour dire « je t'aime » avec un peu de douceur et beaucoup d'humour. Une déclaration qui fond sur la langue.
  pt: |-
    Para dizer "amo-te" com um pouco de doçura e muito humor. Uma declaração que se derrete na boca.
formats: [a6, a5]
tags: [positive-buddy, love]
