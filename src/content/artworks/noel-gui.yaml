title:
  en: 'Christmas - Mistletoe'
  fr: 'Nöel - Gui'
  pt: 'Natal - Visco'
alt:
  en: 'Two gnomes in cozy knitted sweaters are about to share a kiss under the mistletoe. A card to wish a "bonne année" full of love.'
  fr: 'Deux gnomes en pulls tricotés s''apprêtent à échanger un baiser sous le gui. Une carte pour souhaiter une « bonne année » pleine d''amour.'
  pt: 'Dois gnomos de camisolas de malha preparam-se para trocar um beijo debaixo do visco. Um cartão para desejar uma "bonne année" cheia de amor.'
description:
  en: |-
    Under the mistletoe, anything goes, especially kisses. A card to wish a year full of love and tenderness.
  fr: |-
    Sous le gui, tout est permis, surtout les baisers. Une carte pour souhaiter une année remplie d'amour et de tendresse.
  pt: |-
    Debaixo do visco tudo é permitido, sobretudo beijos. Um cartão para desejar um ano cheio de amor e ternura.
formats: [a5card]
tags: [christmas, love]
