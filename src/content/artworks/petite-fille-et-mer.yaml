title:
  en: 'The little girl and the sea'
  fr: 'La Petite fille et la mer'
  pt: 'A Menina e o Mar'
alt:
  en: 'In a yellow raincoat and blue boots, a little girl waves from her giant paper boat, unfazed by the storm and the big waves.'
  fr: 'En ciré jaune et bottes bleues, une petite fille salue depuis son immense bateau en papier, sans craindre la tempête ni les grosses vagues.'
  pt: 'De impermeável amarelo e galochas azuis, uma menina acena do seu enorme barco de papel, sem medo da tempestade nem das grandes ondas.'
description:
  en: |-
    Even when the sky is grey and the waves are big, you can keep smiling and wave at the storm.
  fr: |-
    Même quand le ciel est gris et que les vagues sont grosses, on peut garder le sourire et saluer la tempête.
  pt: |-
    Mesmo quando o céu está cinzento e as ondas são grandes, podemos manter o sorriso e acenar à tempestade.
formats: [a6, a5, a4]
tags: [sea]
