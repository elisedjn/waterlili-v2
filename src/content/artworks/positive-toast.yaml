title:
  en: 'Positive toast'
  fr: 'Positive toast'
  pt: 'Positive toast'
alt:
  en: 'A golden toast with a big smile holds a note: "Nice and toasty, life is butter with you!". A pun full of warmth.'
  fr: 'Une tartine dorée au grand sourire tient un mot : « Nice and toasty, life is butter with you! ». Un jeu de mots plein de chaleur.'
  pt: 'Uma torrada dourada com um grande sorriso segura um bilhete: "Nice and toasty, life is butter with you!". Um jogo de palavras cheio de calor.'
description:
  en: |-
    To tell someone their presence makes life sweeter, like a well-buttered toast on a Sunday morning.
  fr: |-
    Pour dire à quelqu'un que sa présence rend la vie plus douce, comme une tartine bien beurrée un dimanche matin.
  pt: |-
    Para dizer a alguém que a sua presença torna a vida mais doce, como uma torrada bem barrada num domingo de manhã.
formats: [a6]
tags: [positive-buddy]
