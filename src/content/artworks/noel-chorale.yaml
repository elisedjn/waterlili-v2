title:
  en: 'Christmas - Choir'
  fr: 'Nöel - Chorale'
  pt: 'Natal - Coro'
alt:
  en: 'A choir of gnomes of all sizes sings carols together, songbooks in hand, in a warm glow. A card to wish "joyeuses fêtes".'
  fr: 'Une chorale de gnomes de toutes tailles chante des chants de Noël, livret en main, dans une lumière chaleureuse. Une carte pour souhaiter de « joyeuses fêtes ».'
  pt: 'Um coro de gnomos de todos os tamanhos canta canções de Natal, com o livro de cânticos na mão, numa luz acolhedora. Um cartão para desejar "joyeuses fêtes".'
description:
  en: |-
    A little song, voices that are all different, and suddenly the magic of Christmas joins in. Happy holidays, with music!
  fr: |-
    Un petit chant, des voix toutes différentes, et voilà que la magie de Noël s'invite. Joyeuses fêtes en musique !
  pt: |-
    Uma pequena canção, vozes todas diferentes, e eis que a magia do Natal aparece. Boas festas em música!
formats: [a5card]
tags: [christmas]
