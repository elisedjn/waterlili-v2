title:
  en: 'Christmas - Nativity'
  fr: 'Nöel - Crèche'
  pt: 'Natal - Presépio'
alt:
  en: 'A nativity scene told by gnomes: a little angel under the star, shepherds in prayer, two fluffy sheep and a baby in a halo of light.'
  fr: 'Une crèche racontée par des gnomes : un petit ange sous l''étoile, des bergers en prière, deux moutons tout doux et un bébé dans un halo de lumière.'
  pt: 'Um presépio contado por gnomos: um pequeno anjo sob a estrela, pastores em oração, duas ovelhas fofinhas e um bebé num halo de luz.'
description:
  en: |-
    A calm night, a shining star and hearts gathered together: the gentleness of Christmas, simply.
  fr: |-
    Une nuit calme, une étoile qui brille et des cœurs réunis : la douceur de Noël, tout simplement.
  pt: |-
    Uma noite calma, uma estrela a brilhar e corações reunidos: a doçura do Natal, simplesmente.
formats: [a5card]
tags: [christmas]
