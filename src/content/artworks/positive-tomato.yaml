  pt: 'Positive tomato'
alt:
  en: 'A round red tomato holds a note: "I love you from my head to-ma-toes". A cheerful pun to say I love you.'
  fr: 'Une tomate bien ronde et rouge tient un mot : « I love you from my head to-ma-toes ». Un jeu de mots joyeux pour dire je t''aime.'
  pt: 'Um tomate redondo e vermelho segura um bilhete: "I love you from my head to-ma-toes". Um jogo de palavras alegre para dizer eu amo-te.'
description:
  en: |-
    To say "I love you" from head to toe, with a perfectly ripe pun. A declaration with character.
  fr: |-
    Pour dire « je t'aime » de la tête aux pieds, avec un jeu de mots bien mûr. Une déclaration qui a du caractère.
  pt: |-
    Para dizer "amo-te" da cabeça aos pés, com um jogo de palavras bem maduro. Uma declaração com carácter.
formats: [a6]
tags: [positive-buddy, love]
