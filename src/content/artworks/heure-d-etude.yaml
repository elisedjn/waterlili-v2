title:
  en: 'Study hours'
  fr: "Heures d'étude"
  pt: 'Horas de estudo'
alt:
  en: 'On a rainy day, a little ghost with round glasses reads a big book among stacks of books, a quill, an inkwell and a warm lamp.'
  fr: 'Un jour de pluie, un petit fantôme à lunettes rondes lit un gros grimoire, entouré de piles de livres, d''une plume, d''un encrier et d''une lampe chaleureuse.'
  pt: 'Num dia de chuva, um fantasminha de óculos redondos lê um grande livro, rodeado de pilhas de livros, uma pena, um tinteiro e um candeeiro acolhedor.'
description:
  en: |-
    It's raining outside and cozy inside: the perfect time to get lost in a book and let imagination do the rest.
  fr: |-
    Il pleut dehors, il fait bon dedans : c'est l'heure parfaite pour se perdre dans un livre et laisser l'imagination faire le reste.
  pt: |-
    Chove lá fora e está-se bem cá dentro: a hora perfeita para se perder num livro e deixar a imaginação fazer o resto.
formats: [a6, a5]
