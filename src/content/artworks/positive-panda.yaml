title:
  en: 'Positive panda'
  fr: 'Positive panda'
  pt: 'Positive panda'
alt:
  en: 'A fluffy panda on a rainbow background holds a note: "Always be yourself, unless you can be a Panda, then always be a Panda".'
  fr: 'Un panda tout doux sur un fond arc-en-ciel tient un mot : « Always be yourself, unless you can be a Panda, then always be a Panda ».'
  pt: 'Um panda fofinho sobre um fundo arco-íris segura um bilhete: "Always be yourself, unless you can be a Panda, then always be a Panda".'
description:
  en: |-
    A gentle reminder: you are great just as you are. But if you can be a panda, don't hesitate for a second.
  fr: |-
    Un rappel tout doux : tu es très bien comme tu es. Mais si tu peux être un panda, n'hésite pas une seconde.
  pt: |-
    Um lembrete suave: és ótimo tal como és. Mas se puderes ser um panda, não hesites nem um segundo.
formats: [a6, a5]
tags: [positive-buddy, animals]
