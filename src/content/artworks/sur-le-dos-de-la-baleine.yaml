title:
  en: "On the whale's back"
  fr: 'Sur le dos de la baleine'
  pt: 'Nas costas da baleia'
alt:
  en: 'A little girl sleeps peacefully on the back of a giant blue whale, gliding through a starry galaxy crossed by shooting stars.'
  fr: 'Une petite fille dort paisiblement sur le dos d''une baleine bleue géante, qui glisse dans une galaxie étoilée traversée d''étoiles filantes.'
  pt: 'Uma menina dorme serenamente nas costas de uma baleia azul gigante, que desliza numa galáxia estrelada atravessada por estrelas cadentes.'
description:
  en: |-
    Sometimes, all it takes is letting yourself be carried by something bigger than you to cross the night serenely. Sweet dreams.
  fr: |-
    Parfois, il suffit de se laisser porter par plus grand que soi pour traverser la nuit en toute sérénité. Fais de beaux rêves.
  pt: |-
    Por vezes, basta deixarmo-nos levar por algo maior do que nós para atravessar a noite com serenidade. Bons sonhos.
formats: [a6, a5, a4]
tags: [sea, night, animals]
