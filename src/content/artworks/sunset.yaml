title:
  en: 'Sunset'
  fr: 'Sunset'
  pt: 'Sunset'
alt:
  en: 'An abstract sunset where a golden sun, clouds of purple and orange, and a shimmering sea blend together in a play of colors and transparency.'
  fr: 'Un coucher de soleil abstrait où un soleil doré, des nuages violets et orangés et une mer scintillante se fondent dans un jeu de couleurs et de transparence.'
  pt: 'Um pôr do sol abstrato em que um sol dourado, nuvens roxas e laranja e um mar cintilante se fundem num jogo de cores e transparências.'
description:
  en: |-
    Every end of day is an invitation to slow down and watch the colors the sky gives us for free.
  fr: |-
    Chaque fin de journée est une invitation à ralentir et à regarder les couleurs que le ciel nous offre gratuitement.
  pt: |-
    Cada fim de dia é um convite para abrandar e olhar para as cores que o céu nos oferece de graça.
formats: [a6, a5]
