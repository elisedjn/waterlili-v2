title:
  en: 'By the fire'
  fr: 'By the fire'
  pt: 'By the fire'
alt:
  en: 'Two little white creatures sit side by side on a log, warming up by the fire under a sky full of stars, in the heart of a pine forest.'
  fr: 'Deux petits êtres blancs sont assis côte à côte sur un tronc et se réchauffent près du feu, sous un ciel plein d''étoiles, au cœur d''une forêt de sapins.'
  pt: 'Duas pequenas criaturas brancas sentam-se lado a lado num tronco e aquecem-se junto à fogueira, sob um céu cheio de estrelas, no coração de uma floresta de pinheiros.'
description:
  en: |-
    All it takes is a fire, someone you love and a starry sky for the world to turn suddenly gentle.
  fr: |-
    Il suffit d'un feu, d'une personne qu'on aime et d'un ciel étoilé pour que le monde devienne soudain très doux.
  pt: |-
    Basta uma fogueira, alguém de quem gostamos e um céu estrelado para o mundo ficar de repente muito suave.
formats: [a6, a5]
tags: [night]
order: 20
