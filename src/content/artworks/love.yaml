  pt: 'Love'
alt:
  en: 'Overlapping, translucent hearts in shades of red, pink and orange, with the word "love" handwritten beside them. Pure watercolor transparency.'
  fr: 'Des cœurs translucides rouges, roses et orangés qui se superposent, avec le mot « love » calligraphié à côté. Toute la transparence de l''aquarelle.'
  pt: 'Corações translúcidos em tons de vermelho, rosa e laranja que se sobrepõem, com a palavra "love" escrita à mão ao lado. Toda a transparência da aguarela.'
description:
  en: |-
    Because we never say it enough: a little love always overflows, and that's just fine.
  fr: |-
    Parce qu'on ne le dit jamais assez : un peu d'amour, ça déborde toujours, et c'est très bien comme ça.
  pt: |-
    Porque nunca o dizemos o suficiente: um bocadinho de amor transborda sempre, e ainda bem.
formats: [a6]
