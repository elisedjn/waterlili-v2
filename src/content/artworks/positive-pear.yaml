title:
  en: 'Positive pear'
  fr: 'Positive pear'
  pt: 'Positive pear'
alt:
  en: 'A cheerful pear with a big leaf holds a note: "You look pear-fect today". A pun to give a compliment.'
  fr: 'Une poire joyeuse à la grande feuille tient un mot : « You look pear-fect today ». Un jeu de mots pour faire un compliment.'
  pt: 'Uma pera alegre com uma grande folha segura um bilhete: "You look pear-fect today". Um jogo de palavras para fazer um elogio.'
description:
  en: |-
    A compliment to share with someone (or yourself) to start the day with a smile.
  fr: |-
    Un compliment à glisser à quelqu'un (ou à soi-même) pour commencer la journée avec le sourire.
  pt: |-
    Um elogio para oferecer a alguém (ou a ti) para começar o dia com um sorriso.
formats: [a6]
tags: [positive-buddy]
