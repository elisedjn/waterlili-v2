  fr: 'Positive mushroom'
  pt: 'Positive mushroom'
alt:
  en: 'A smiling little mushroom holds a note: "I have so mush-room for you in my heart". A pun to brighten someone''s day.'
  fr: 'Un petit champignon souriant tient un mot doux : « I have so mush-room for you in my heart ». Un jeu de mots pour illuminer la journée de quelqu''un.'
  pt: 'Um pequeno cogumelo sorridente segura um bilhete: "I have so mush-room for you in my heart". Um jogo de palavras para alegrar o dia de alguém.'
description:
  en: |-
    A sweet little note to tell someone they have all the room they need in your heart.
  fr: |-
    Un petit mot doux pour dire à quelqu'un qu'il a toute la place qu'il faut dans ton cœur.
  pt: |-
    Um bilhetinho doce para dizer a alguém que tem todo o espaço do mundo no teu coração.
formats: [a6, a5]
tags: [positive-buddy]
